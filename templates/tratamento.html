{% extends 'base.html' %}{% block content %}<section><h2>Registrar atendimento veterinário</h2><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label for="animal">Animal</label><select id="animal" name="animal_id" required>{% for a in animals %}<option value="{{a.id}}">{{a.nome}} (ID {{a.id}})</option>{% endfor %}</select><label for="data">Data</label><input id="data" name="data" type="date" required><label for="procedimento">Procedimento</label><input id="procedimento" name="procedimento" required><label for="obs">Observações</label><textarea id="obs" name="observacoes"></textarea><button>Salvar tratamento</button></form></section>{% endblock %}
