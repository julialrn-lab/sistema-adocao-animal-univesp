{% extends 'base.html' %}{% block content %}<h2>Painel de controle</h2><div class="stats">{% for label,value in counts.items() %}<section><p>{{label}}</p><strong>{{value}}</strong></section>{% endfor %}</div><section><h2>Animais cadastrados</h2><div class="table-scroll"><table><thead><tr><th>ID</th><th>Nome</th><th>Resgate</th><th>Situação</th></tr></thead><tbody>{% for a in animals %}<tr><td>{{a.id}}</td><td><a href="{{url_for('animal',animal_id=a.id)}}">{{a.nome}}</a></td><td>{{a.resgate}}</td><td>{{a.status}}</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
