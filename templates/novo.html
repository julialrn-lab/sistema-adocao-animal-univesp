{% extends 'base.html' %}{% block content %}<section><h2>Cadastrar novo cão</h2><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label for="nome">Nome / identificação</label><input id="nome" name="nome" required maxlength="100"><label for="sexo">Sexo</label><select id="sexo" name="sexo"><option>Não informado</option><option>Fêmea</option><option>Macho</option></select><label for="idade">Idade estimada</label><input id="idade" name="idade"><label for="resgate">Data do resgate</label><input id="resgate" name="resgate" type="date"><label for="status">Situação</label><select id="status" name="status">{% for s in statuses %}<option>{{s}}</option>{% endfor %}</select><label for="obs">Observações</label><textarea id="obs" name="observacoes"></textarea><label for="foto">Fotografia (JPG, PNG ou WEBP, até 3 MB)</label><input id="foto" name="foto" type="file" accept="image/jpeg,image/png,image/webp"><button type="submit">Salvar cadastro</button></form></section>{% endblock %}
